<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">wserver: a multithreaded web server in C</title>
<desc id="d">Diagram-style illustration: GET requests travel from the accepting main thread into an eight-slot bounded buffer, which hands them out to four worker threads. Captions mention FIFO, SFF and random scheduling, and realpath() keeping requests inside ./www.</desc>
